[package]
name = "gitinfo"
version = "3.0.0"
description = "GitInfo Desktop Application"
authors = ["m5dev"]
edition = "2021"

[lib]
name = "gitinfo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
